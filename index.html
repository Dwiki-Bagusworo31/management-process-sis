
<script>
"use strict";

// KONFIGURASI SUPABASE — SATU KALI SAJA
const SUPABASE_URL = "https://maveqvmzydqvroohepum.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8pydnk2otFO-29gT0ECYAw_HLQ435mX";
const SIS_REDIRECT_URL =
    "https://management-process-sis.ezel-bagaskara21-dfc.workers.dev/";

let sisSupabase = null;
let currentSISUser = null;
let sisAuthInitialized = false;

function showLoginMessage(message) {
    const el = document.getElementById("loginMessage");
    if (!el) return;

    el.textContent = message;
    el.classList.remove("hidden");
}

function clearLoginMessage() {
    const el = document.getElementById("loginMessage");
    if (!el) return;

    el.textContent = "";
    el.classList.add("hidden");
}

function showSISLogin() {
    document.getElementById("loginScreen")?.classList.remove("hidden");
    document.getElementById("sisApp")?.classList.add("hidden");
}

function showSISApp() {
    document.getElementById("loginScreen")?.classList.add("hidden");
    document.getElementById("sisApp")?.classList.remove("hidden");

    const emailEl = document.getElementById("sisUserEmail");
    if (emailEl) emailEl.textContent = currentSISUser?.email || "";
}

async function verifySISSession(session) {
    if (!session?.user) {
        currentSISUser = null;
        showSISLogin();
        return false;
    }

    const { data: profile, error } = await sisSupabase
        .from("profiles")
        .select("role")
        .eq("id", session.user.id)
        .maybeSingle();

    if (error) {
        console.error("Pemeriksaan profil gagal:", error);
        showLoginMessage(
            "Profil akun gagal diperiksa. Periksa tabel profiles dan policy RLS."
        );
        showSISLogin();
        return false;
    }

    if (!profile || !["admin", "team"].includes(profile.role)) {
        currentSISUser = null;
        await sisSupabase.auth.signOut();

        showLoginMessage(
            "Akun belum memiliki role admin atau team pada tabel profiles."
        );
        showSISLogin();
        return false;
    }

    currentSISUser = session.user;
    showSISApp();
    return true;
}

// LOGIN
async function handleSISLogin(event) {
    event.preventDefault();
    clearLoginMessage();

    const email = document.getElementById("loginEmail")?.value.trim() || "";
    const password = document.getElementById("loginPassword")?.value || "";
    const button = document.getElementById("loginSubmit");

    if (!email || !password) {
        showLoginMessage("Masukkan email dan password.");
        return;
    }

    if (button) {
        button.disabled = true;
        button.textContent = "Memeriksa...";
    }

    try {
        const { data, error } = await sisSupabase.auth.signInWithPassword({
            email,
            password
        });

        if (error) {
            console.error("Login Supabase gagal:", error);
            showLoginMessage("Login gagal: " + error.message);
            return;
        }

        await verifySISSession(data.session);
    } catch (error) {
        console.error("Kesalahan login:", error);
        showLoginMessage("Koneksi login gagal. Periksa koneksi internet.");
    } finally {
        if (button) {
            button.disabled = false;
            button.textContent = "Masuk";
        }
    }
}

// LUPA SANDI — GUNAKAN SDK AUTH SUPABASE
async function handleSISForgotPassword(event) {
    event?.preventDefault();
    clearLoginMessage();

    const emailInput = document.getElementById("loginEmail");
    const email = emailInput?.value.trim() || "";
    const button = document.getElementById("forgotPasswordButton");

    if (!sisSupabase) {
        showLoginMessage("Supabase belum siap. Muat ulang halaman.");
        return;
    }

    if (!email) {
        showLoginMessage("Masukkan email akun terlebih dahulu.");
        emailInput?.focus();
        return;
    }

    if (button) {
        button.disabled = true;
        button.textContent = "Mengirim...";
    }

    try {
        const { error } = await sisSupabase.auth.resetPasswordForEmail(email, {
            redirectTo: SIS_REDIRECT_URL
        });

        if (error) {
            console.error("Reset sandi gagal:", error);
            showLoginMessage(
                "Reset sandi gagal: " + error.message +
                " (HTTP " + (error.status || "tidak diketahui") + ")"
            );
            return;
        }

        showLoginMessage(
            "Permintaan reset sandi telah diproses. " +
            "Periksa inbox dan folder spam."
        );
    } catch (error) {
        console.error("Kesalahan reset sandi:", error);
        showLoginMessage(
            "Koneksi reset sandi gagal: " +
            (error.message || "Kesalahan tidak diketahui.")
        );
    } finally {
        if (button) {
            button.disabled = false;
            button.textContent = "Lupa Sandi?";
        }
    }
}

// LOGOUT
async function logoutSIS() {
    if (!sisSupabase) return;

    const button = document.getElementById("logoutButton");
    if (button) button.disabled = true;

    try {
        const { error } = await sisSupabase.auth.signOut();
        if (error) throw error;

        currentSISUser = null;

        const passwordInput = document.getElementById("loginPassword");
        if (passwordInput) passwordInput.value = "";

        showSISLogin();

        if (typeof showToast === "function") {
            showToast("Berhasil keluar dari sistem.");
        }
    } catch (error) {
        console.error("Logout gagal:", error);

        if (typeof showToast === "function") {
            showToast("Gagal keluar. Periksa koneksi lalu coba lagi.");
        }
    } finally {
        if (button) button.disabled = false;
    }
}

// INISIALISASI AUTENTIKASI SATU KALI
async function initializeSISAuth() {
    if (sisAuthInitialized) return;
    sisAuthInitialized = true;

    if (!window.supabase?.createClient) {
        showLoginMessage("Library Supabase gagal dimuat. Periksa koneksi internet.");
        return;
    }

    try {
        sisSupabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                }
            }
        );

        document.getElementById("loginForm")
            ?.addEventListener("submit", handleSISLogin);

        document.getElementById("forgotPasswordButton")
            ?.addEventListener("click", handleSISForgotPassword);

        sisSupabase.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_OUT" || !session) {
                currentSISUser = null;
                showSISLogin();
            }
        });

        const { data, error } = await sisSupabase.auth.getSession();
        if (error) throw error;

        if (data.session) {
            await verifySISSession(data.session);
        } else {
            showSISLogin();
        }
    } catch (error) {
        console.error("Inisialisasi autentikasi gagal:", error);
        showLoginMessage(
            "Autentikasi gagal diinisialisasi. Periksa konfigurasi Supabase."
        );
        showSISLogin();
    }
}

if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initializeSISAuth, {
        once: true
    });
} else {
    initializeSISAuth();
}
</script>
