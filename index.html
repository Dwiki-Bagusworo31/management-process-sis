<script>
    const SUPABASE_URL = "https://maveqvmzydqvroohepum.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8pydnk2otFO-29gT0ECYAw_HLQ435mX";

    let sisSupabase = null;
    let currentSISUser = null;

    function showLoginMessage(message) {
        const el = document.getElementById("loginMessage");
        if (!el) return;
        el.textContent = message;
        el.classList.remove("hidden");
    }

    function showSISLogin() {
        document.getElementById("loginScreen")?.classList.remove("hidden");
        document.getElementById("sisApp")?.classList.add("hidden");
    }

    function showSISApp() {
        document.getElementById("loginScreen")?.classList.add("hidden");
        document.getElementById("sisApp")?.classList.remove("hidden");

        const emailElement = document.getElementById("sisUserEmail");
        if (emailElement) {
            emailElement.textContent = currentSISUser?.email || "";
        }
    }

    async function verifySISSession(session) {
        if (!session?.user) {
            currentSISUser = null;
            showSISLogin();
            return false;
        }

        const { data: profile, error } = await sisSupabase
            .from("profiles")
            .select("role")
            .eq("id", session.user.id)
            .maybeSingle();

        if (error) {
            console.error("Pemeriksaan profil gagal:", error);
            showLoginMessage(
                "Profil akun gagal diperiksa. Periksa tabel profiles dan policy RLS."
            );
            showSISLogin();
            return false;
        }

        if (!profile || !["admin", "team"].includes(profile.role)) {
            await sisSupabase.auth.signOut();
            currentSISUser = null;
            showLoginMessage(
                "Akun belum memiliki role admin atau team pada tabel profiles."
            );
            showSISLogin();
            return false;
        }

        currentSISUser = session.user;
        showSISApp();
        return true;
    }

    async function handleSISForgotPassword(event) {
        event?.preventDefault();

        const emailInput = document.getElementById("loginEmail");
        const email = emailInput?.value.trim() || "";
        const button = document.getElementById("forgotPasswordButton");

        document.getElementById("loginMessage")?.classList.add("hidden");

        if (!sisSupabase) {
            showLoginMessage("Koneksi Supabase belum siap. Muat ulang halaman.");
            return;
        }

        if (!email) {
            showLoginMessage("Masukkan email terlebih dahulu untuk reset sandi.");
            emailInput?.focus();
            return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showLoginMessage("Format email belum benar.");
            emailInput?.focus();
            return;
        }

        if (button) {
            button.disabled = true;
            button.textContent = "Mengirim...";
        }

        try {
            const redirectTo = window.location.origin + window.location.pathname;

            const { error } = await sisSupabase.auth.resetPasswordForEmail(email, {
                redirectTo
            });

            if (error) {
                console.error("Reset sandi gagal:", error);
                showLoginMessage(
                    "Reset sandi gagal: " +
                    error.message +
                    " (Kode: " +
                    (error.status || "-") +
                    ")"
                );
                return;
            }

            showLoginMessage(
                "Permintaan reset sandi berhasil dikirim jika email terdaftar. " +
                "Periksa inbox dan folder spam."
            );
        } catch (error) {
            console.error("Kesalahan reset sandi:", error);
            showLoginMessage(
                "Kesalahan koneksi saat meminta reset sandi. Coba kembali."
            );
        } finally {
            if (button) {
                button.disabled = false;
                button.textContent = "Lupa Sandi?";
            }
        }
    }

    async function logoutSIS() {
        if (!sisSupabase) return;

        const button = document.getElementById("logoutButton");
        if (button) button.disabled = true;

        try {
            const { error } = await sisSupabase.auth.signOut();
            if (error) throw error;

            currentSISUser = null;

            const passwordInput = document.getElementById("loginPassword");
            if (passwordInput) passwordInput.value = "";

            showSISLogin();
            showToast("Berhasil keluar dari sistem.");
        } catch (error) {
            console.error("Logout gagal:", error);
            showToast("Gagal keluar. Periksa koneksi lalu coba lagi.");
        } finally {
            if (button) button.disabled = false;
        }
    }

    document.addEventListener("DOMContentLoaded", async () => {
        if (!window.supabase?.createClient) {
            showLoginMessage(
                "Komponen Supabase gagal dimuat. Periksa koneksi internet."
            );
            return;
        }

        sisSupabase = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY,
            {
                auth: {
                    autoRefreshToken: true,
                    persistSession: true,
                    detectSessionInUrl: true
                }
            }
        );

        const loginForm = document.getElementById("loginForm");

        loginForm?.addEventListener("submit", async (event) => {
            event.preventDefault();

            const button = document.getElementById("loginSubmit");
            const email = document.getElementById("loginEmail")?.value.trim() || "";
            const password = document.getElementById("loginPassword")?.value || "";

            document.getElementById("loginMessage")?.classList.add("hidden");

            if (!email || !password) {
                showLoginMessage("Masukkan email dan sandi.");
                return;
            }

            if (button) {
                button.disabled = true;
                button.textContent = "Memeriksa...";
            }

            try {
                const { data, error } = await sisSupabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    console.error("Login gagal:", error);
                    showLoginMessage("Login gagal: " + error.message);
                    return;
                }

                const verified = await verifySISSession(data.session);

                if (!verified) {
                    await sisSupabase.auth.signOut();
                }
            } catch (error) {
                console.error("Kesalahan login:", error);
                showLoginMessage("Kesalahan koneksi saat login.");
            } finally {
                if (button) {
                    button.disabled = false;
                    button.textContent = "Masuk";
                }
            }
        });

        document.getElementById("forgotPasswordButton")
            ?.addEventListener("click", handleSISForgotPassword);

        try {
            const { data, error } = await sisSupabase.auth.getSession();
            if (error) throw error;

            if (data.session) {
                await verifySISSession(data.session);
            } else {
                showSISLogin();
            }
        } catch (error) {
            console.error("Pemeriksaan sesi gagal:", error);
            showLoginMessage(
                "Sesi tidak dapat diperiksa. Muat ulang halaman."
            );
            showSISLogin();
        }

        sisSupabase.auth.onAuthStateChange((event, session) => {
            if (event === "SIGNED_OUT" || !session) {
                currentSISUser = null;
                showSISLogin();
            }
        });
    });
</script>
